name: Deploy to Hostinger

# Builds the portfolio as a static export and uploads it to Hostinger over FTP.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    e.g. ftp.muharferdiansyah.my.id  (or your Hostinger server IP)
#   FTP_USERNAME  the Hostinger FTP account username
#   FTP_PASSWORD  the Hostinger FTP account password
#
# Optional repository variables (Settings > Secrets and variables > Actions > Variables):
#   SITE_URL        override the canonical/OG domain (defaults to the production domain)
#   FTP_SERVER_DIR  remote folder for the upload (defaults to /public_html/)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://muharferdiansyah.my.id' }}
        run: pnpm build

      - name: Remove junk files
        run: find out -name '.DS_Store' -delete

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: false
